name: Build BKOS5a firmware

on:
  push:
    branches: [main]
    paths:
      - '*.ino'
      - '*.h'
      - '.github/workflows/build.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Arduino CLI installeren
        uses: arduino/setup-arduino-cli@v1

      - name: ESP32 platform installeren
        run: |
          arduino-cli core update-index \
            --additional-urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          arduino-cli core install esp32:esp32@2.0.17 \
            --additional-urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json

      - name: Bibliotheken installeren
        run: |
          arduino-cli lib install "Arduino_GFX_Library"
          arduino-cli lib install "TAMC_GT911"
          arduino-cli lib install "WiFiManager"
          arduino-cli lib install "NTPClient"

      - name: Compileren
        run: |
          arduino-cli compile \
            --fqbn "esp32:esp32:esp32s3:PSRAM=opi,PartitionScheme=default,FlashSize=16M,FlashMode=qio,CDCOnBoot=cdc" \
            --output-dir build/esp32.esp32.esp32s3 \
            .

      - name: Commit en push firmware.bin
        run: |
          git config user.name  "GitHub Actions"
          git config user.email "actions@github.com"
          git add build/esp32.esp32.esp32s3/BKOS5a.ino.bin
          git diff --cached --quiet || git commit -m "CI: firmware.bin bijgewerkt"
          git push
